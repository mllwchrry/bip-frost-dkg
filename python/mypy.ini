[mypy]
# Include paths to vendored copies of secp256k1lab and ed25519lab, in order
# to avoid "import-not-found" errors in mypy's `--strict` mode
mypy_path = $MYPY_CONFIG_FILE_DIR/secp256k1lab/src:$MYPY_CONFIG_FILE_DIR/ed25519lab/src
# ed25519lab's vendored `test/` package would collide with secp256k1lab's (both
# are top-level `test`), so it is excluded here. Its `src/` is left in — it
# type-checks cleanly under the fork's mypy, same as secp256k1lab/src.
exclude = ed25519lab/test/